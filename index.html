<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>3D Button Demo</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="intro">
        <p class="eyebrow">Component demo</p>
        <h1>3D Buttons</h1>
        <p class="lede">
          Drei Varianten mit weicher Tiefe, Hover-Lift und einer
          haptischen Press-Animation. Reine HTML, CSS und JS &mdash;
          kein Build.
        </p>
      </header>

      <section class="card" aria-label="Button-Varianten">
        <div class="button-container">
          <button class="button button-primary">Prim&auml;rer Button</button>
          <button class="button button-secondary">Sekund&auml;rer Button</button>
          <button class="button button-ghost">Ghost Button</button>
        </div>
      </section>

      <footer class="meta">
        <span>Tab zum Fokussieren &middot; Space oder Enter zum Klicken</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
